[package]
name = "hwprobe"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Cross-platform hardware probe for local AI model fit estimates (no privileges required)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "hwprobe"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation"] }
