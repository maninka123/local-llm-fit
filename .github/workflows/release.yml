name: Release desktop apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build, e.g. v1.1.0"
        required: true

env:
  # The version tag: the pushed tag, or the one chosen when run by hand.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          # 64-bit ARM Linux: Raspberry Pi 4/5 (64-bit OS), Jetson, RK3588 boards.
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux system libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Release notes (download guide)
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            node scripts/release-notes.mjs "${TAG#v}" body
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles so installed apps can verify them (key kept as a repo secret).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ env.TAG }}
          releaseName: Model Fit Explorer ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # A draft until every platform is uploaded; the finalize job publishes it.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The in-app update window shows latest.json "notes": replace the long release-page text
  # with the short "What's new" bullets from CHANGELOG.md, then publish the release.
  # Runs only when every platform built, so nobody sees (or auto-updates to) a partial release;
  # if one fails the draft stays for a look.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - name: Short update notes in latest.json, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${TAG#v}"
          gh release download "$TAG" --pattern latest.json --clobber
          NOTES="$(node scripts/release-notes.mjs "$V" notes)" node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            d.notes = process.env.NOTES;
            fs.writeFileSync("latest.json", JSON.stringify(d, null, 2));'
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false --latest
