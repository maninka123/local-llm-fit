name: Release desktop apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Release notes (download guide)
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" body
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles so installed apps can verify them (key kept as a repo secret).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Model Fit Explorer ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Published (not draft) so installed apps can find latest.json for auto-update.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The in-app update window shows latest.json "notes": replace the long release-page text
  # with the short "What's new" bullets from CHANGELOG.md.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Short update notes in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --clobber
          NOTES="$(node scripts/release-notes.mjs "$V" notes)" node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            d.notes = process.env.NOTES;
            fs.writeFileSync("latest.json", JSON.stringify(d, null, 2));'
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
